apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: product-service-ingress
  namespace: ecommerce

spec:
  ingressClassName: nginx

  rules:
    - host: ecommerce.local
      http:
        paths:
          - path: /api/v1/products
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080